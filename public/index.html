<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Southern Recipe Book</title>
  <meta name="description" content="Top-rated Southern recipes as easy-to-read recipe cards. Save your favorites." />
  <meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1512" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23a63d2f'/%3E%3Cpath d='M18 16h20a8 8 0 0 1 8 8v24H26a8 8 0 0 1-8-8z' fill='%23fffdf8'/%3E%3Cpath d='M24 26h16M24 33h16M24 40h10' stroke='%23a63d2f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem("rb-theme");
      if (t === "light" || t === "dark" || t === "system") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" id="site-header">
    <div class="header-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4z" fill="var(--surface)"/><path d="M12.5 13h7M12.5 16.5h7M12.5 20h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-text">Southern <em>Recipe Book</em></span>
      </a>

      <nav class="main-nav" aria-label="Recipe views">
        <a href="#/" data-nav="all">All recipes</a>
        <a href="#/favorites" data-nav="favorites">Favorites <span class="count" id="fav-count">0</span></a>
        <a href="#/hidden" data-nav="hidden">Hidden <span class="count" id="hidden-count">0</span></a>
      </nav>

      <div class="header-actions">
        <div class="theme-switch" role="radiogroup" aria-label="Color theme">
          <button type="button" role="radio" data-theme-choice="light" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button type="button" role="radio" data-theme-choice="dark" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" role="radio" data-theme-choice="system" title="Match system" aria-label="Match system theme">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 20h8M12 16v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div class="user-menu">
          <span class="user-name" id="user-name"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="logout-btn">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading" id="boot">Warming up the skillet…</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button type="button" class="toast-action" id="toast-action" hidden></button>
  </div>

  <footer class="site-footer" id="site-footer" hidden>
    Recipes are credited to their original authors and link back to the source. Ratings reflect each source site at the time of collection.
  </footer>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
